<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zozen Store - Direct APK & AAB Packages Hub</title>
    
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #222222;
            --accent-color: #0066ff;
            --accent-hover: #0052cc;
            --card-bg: #f8f9fa;
            --border-color: #e5e5e5;
            --success-color: #10b981;
            --star-color: #f59e0b;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            padding: 20px 40px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
            color: var(--accent-color);
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
            flex: 1;
            width: 100%;
            box-sizing: border-box;
        }

        .section-title {
            font-size: 20px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
            font-weight: 600;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.06);
        }

        .card-top {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 12px;
        }

        .app-favicon {
            width: 44px;
            height: 44px;
            object-fit: cover;
            border-radius: 10px;
            background: #fff;
            padding: 4px;
            border: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .card-header h3 {
            margin: 0 0 4px 0;
            font-size: 17px;
            color: #111;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .developer-name {
            font-size: 12px;
            color: var(--accent-color);
            font-weight: 600;
            margin-bottom: 6px;
        }

        .badge {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 20px;
            background: #e0edff;
            color: var(--accent-color);
            font-weight: 700;
            text-transform: uppercase;
        }

        .card-header p {
            color: #555;
            font-size: 13px;
            margin: 0 0 10px 0;
            line-height: 1.4;
        }

        /* نظام النجوم */
        .stars-container {
            display: flex;
            align-items: center;
            gap: 4px;
            color: var(--star-color);
            font-size: 14px;
            margin-bottom: 10px;
        }

        .stars-container span {
            color: #777;
            font-size: 12px;
            margin-left: 6px;
        }

        .file-meta {
            font-size: 12px;
            color: #888;
            margin-bottom: 12px;
            background: #fff;
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        /* قسم التعليقات المصغر داخل البطاقة */
        .reviews-box {
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 14px;
            max-height: 110px;
            overflow-y: auto;
            font-size: 12px;
        }

        .reviews-box h5 {
            margin: 0 0 6px 0;
            font-size: 12px;
            color: #333;
            border-bottom: 1px solid #eee;
            padding-bottom: 4px;
        }

        .review-item {
            margin-bottom: 6px;
            color: #555;
            border-bottom: 1px dashed #f0f0f0;
            padding-bottom: 4px;
        }

        .review-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }

        .add-review-row {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
        }

        .add-review-row input {
            flex: 1;
            padding: 6px 8px;
            font-size: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
        }

        .add-review-row button {
            padding: 6px 10px;
            font-size: 12px;
            background: #eee;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .add-review-row button:hover {
            background: #e2e8f0;
        }

        .app-download-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 11px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            box-sizing: border-box;
            text-decoration: none;
            background-color: var(--accent-color);
            border: none;
            color: #ffffff;
            transition: background-color 0.2s ease;
        }

        .app-download-btn:hover {
            background-color: var(--accent-hover);
        }

        .dev-section {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 40px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 600;
        }

        .form-group input[type="text"], .form-group textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            background: #fff;
        }

        .drop-zone {
            border: 2px dashed #b0c4de;
            border-radius: 10px;
            padding: 25px 20px;
            text-align: center;
            background-color: #ffffff;
            transition: all 0.2s ease;
        }

        .drop-zone.dragover {
            border-color: var(--accent-color);
            background-color: #f0f6ff;
        }

        .drop-zone.has-file {
            border-color: var(--success-color);
            background-color: #ecfdf5;
        }

        .drop-zone p {
            margin: 0 0 12px 0;
            font-size: 14px;
            color: #444;
            font-weight: 500;
        }

        .btn-browse {
            background-color: #e2e8f0;
            color: #1e293b;
            border: none;
            padding: 9px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: background-color 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-browse:hover {
            background-color: #cbd5e1;
        }

        .btn-submit {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 13px 26px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 15px;
            width: 100%;
            transition: background-color 0.2s ease;
        }

        .btn-submit:hover:not(:disabled) {
            background-color: var(--accent-hover);
        }

        .btn-submit:disabled {
            background-color: #99c2ff;
            cursor: not-allowed;
        }

        footer {
            text-align: center;
            padding: 20px;
            border-top: 1px solid var(--border-color);
            color: #777;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Zozen Store</h1>
        <span>Direct APK & AAB Packages Hub</span>
    </header>

    <div class="container">
        <div class="section-title">Available Applications</div>
        <div class="grid" id="appsContainer">
            <p id="loadingText" style="color: #888;">Loading packages from store...</p>
        </div>

        <div class="section-title">Developer Hub - Upload Package</div>
        <div class="dev-section">
            <div class="form-group">
                <label>Application Name</label>
                <input type="text" id="appName" placeholder="e.g. Doors OS Mobile">
            </div>
            <div class="form-group">
                <label>Developer / Publisher Name</label>
                <input type="text" id="appDev" placeholder="e.g. Zozen Team">
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea id="appDesc" rows="3" placeholder="What does this app do?"></textarea>
            </div>
            <div class="form-group">
                <label>App Package File (.apk, .aab, .exe, .zip)</label>
                <div class="drop-zone" id="dropZone">
                    <p id="dropZoneText">Drag & Drop your APK or AAB file here</p>
                    <button type="button" class="btn-browse" onclick="document.getElementById('appFileInput').click()">
                        📁 Browse Device (APK / AAB)
                    </button>
                    <input type="file" id="appFileInput" accept=".apk,.aab,.exe,.zip" style="display: none;">
                </div>
            </div>
            <button class="btn-submit" id="publishBtn" onclick="publishApp()">Upload & Publish Package</button>
        </div>
    </div>

    <footer>
        &copy; 2026 Zozen Store. Direct Verified Packages.
    </footer>

    <script>
        const SUPABASE_URL = "https://lzvtnfdgynwczrkwlwhf.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx6dnRuZmRneW53Y3pya3dsd2hmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxNDIxMTEsImV4cCI6MjEwNDcxODExMX0.w2hNlJ4SszyMBkUVjr1qiWNTTPxHMHkM9YOFtVP-pVI";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const BUCKET_NAME = 'app-packages';

        let selectedFile = null;

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('appFileInput');
        const dropZoneText = document.getElementById('dropZoneText');

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                handleFileSelection(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFileSelection(e.target.files[0]);
            }
        });

        function handleFileSelection(file) {
            const allowedExtensions = ['apk', 'aab', 'exe', 'zip'];
            const ext = file.name.split('.').pop().toLowerCase();
            
            if (!allowedExtensions.includes(ext)) {
                alert('يرجى اختيار ملف بصيغة APK أو AAB أو EXE أو ZIP فقط.');
                return;
            }

            selectedFile = file;
            const sizeMB = (file.size / (1024 * 1024)).toFixed(2);
            dropZone.classList.add('has-file');
            dropZoneText.innerHTML = `✅ Selected: <strong>${file.name}</strong> <br><span style="font-size:12px; color:#555;">Type: .${ext.toUpperCase()} | Size: ${sizeMB} MB</span>`;
        }

        async function fetchApps() {
            const container = document.getElementById('appsContainer');
            try {
                const { data: apps, error } = await supabaseClient
                    .from('apps')
                    .select('*')
                    .order('id', { ascending: false });

                if (error) throw error;

                container.innerHTML = '';
                if (!apps || apps.length === 0) {
                    container.innerHTML = '<p style="color: #888;">No packages uploaded yet.</p>';
                    return;
                }

                apps.forEach(app => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    
                    const fileUrl = app.exe_url || app.file_url || '#';
                    const appName = app.name || 'Untitled App';
                    const devName = app.developer || 'Zozen Official';
                    const appDesc = app.description || 'Official direct package.';
                    
                    const cleanUrl = fileUrl.split('?')[0];
                    const fileName = cleanUrl.split('/').pop() || `${appName}.apk`;
                    const ext = fileName.includes('.') ? fileName.split('.').pop().toUpperCase() : 'PKG';

                    const iconUrl = ext === 'APK' || ext === 'AAB' 
                        ? 'https://cdn-icons-png.flaticon.com/512/226/226770.png' 
                        : 'https://cdn-icons-png.flaticon.com/512/5977/5977575.png';

                    // تحضير التعليقات (إذا كانت مخزنة كـ JSON أو مصفوفة، وإلا عرض تعليق افتراضي ترحيبي)
                    let reviewsList = [];
                    try {
                        reviewsList = typeof app.reviews === 'string' ? JSON.parse(app.reviews) : (app.reviews || []);
                    } catch(e) {
                        reviewsList = [];
                    }

                    if(reviewsList.length === 0) {
                        reviewsList = [{user: "System", text: "تطبيق ممتاز ومستقر جداً!"}];
                    }

                    let reviewsHtml = reviewsList.map(r => `<div class="review-item"><strong>${r.user}:</strong> ${r.text}</div>`).join('');

                    card.innerHTML = `
                        <div>
                            <div class="card-top">
                                <img src="${iconUrl}" class="app-favicon" alt="App Icon">
                                <div class="card-header">
                                    <h3>${appName} <span class="badge">${ext}</span></h3>
                                    <div class="developer-name">By ${devName}</div>
                                    <p>${appDesc}</p>
                                </div>
                            </div>
                            
                            <!-- النجوم والتقييم -->
                            <div class="stars-container">
                                ⭐⭐⭐⭐⭐ <span>(4.9 / 5.0)</span>
                            </div>

                            <div class="file-meta">
                                File: <strong>${decodeURIComponent(fileName)}</strong>
                            </div>

                            <!-- صندوق التعليقات -->
                            <div class="reviews-box">
                                <h5>User Reviews</h5>
                                <div id="reviews-list-${app.id}">
                                    ${reviewsHtml}
                                </div>
                            </div>

                            <!-- إضافة تعليق سريع -->
                            <div class="add-review-row">
                                <input type="text" id="review-input-${app.id}" placeholder="أضف تعليقك...">
                                <button onclick="addReview(${app.id})">تعليق</button>
                            </div>
                        </div>

                        <a href="${fileUrl}" download="${decodeURIComponent(fileName)}" class="app-download-btn">
                            ⬇ Download Direct (${ext})
                        </a>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                console.error('Error fetching apps:', err);
                container.innerHTML = '<p style="color: #d9534f;">Failed to load packages. Check Supabase connection.</p>';
            }
        }

        async function addReview(appId) {
            const input = document.getElementById(`review-input-${appId}`);
            const text = input.value.trim();
            if(!text) return;

            try {
                // جلب التطبيق الحالي
                const { data: appData, error: fetchErr } = await supabaseClient.from('apps').select('reviews').eq('id', appId).single();
                if(fetchErr) throw fetchErr;

                let currentReviews = [];
                try {
                    currentReviews = typeof appData.reviews === 'string' ? JSON.parse(appData.reviews) : (appData.reviews || []);
                } catch(e) {
                    currentReviews = [];
                }

                currentReviews.push({ user: "مستخدم", text: text });

                // تحديث قاعدة البيانات
                const { error: updateErr } = await supabaseClient.from('apps').update({ reviews: JSON.stringify(currentReviews) }).eq('id', appId);
                if(updateErr) throw updateErr;

                input.value = '';
                fetchApps();
            } catch(err) {
                alert('فشل إضافة التعليق: ' + err.message);
            }
        }

        async function publishApp() {
            const name = document.getElementById('appName').value.trim();
            const developer = document.getElementById('appDev').value.trim() || 'Zozen Official';
            const description = document.getElementById('appDesc').value.trim();
            const publishBtn = document.getElementById('publishBtn');

            if (!name || !selectedFile) {
                alert('Please enter the Application Name and select an APK/AAB file.');
                return;
            }

            publishBtn.disabled = true;
            publishBtn.textContent = 'Uploading Package... Please wait';

            try {
                const safeFileName = `${Date.now()}_${selectedFile.name.replace(/[^a-zA-Z0-9._-]/g, '_')}`;

                const { data: uploadData, error: uploadError } = await supabaseClient.storage
                    .from(BUCKET_NAME)
                    .upload(safeFileName, selectedFile, {
                        cacheControl: '3600',
                        upsert: false
                    });

                if (uploadError) throw uploadError;

                const { data: publicUrlData } = supabaseClient.storage
                    .from(BUCKET_NAME)
                    .getPublicUrl(safeFileName);

                const directFileUrl = publicUrlData.publicUrl;

                const { error: dbError } = await supabaseClient
                    .from('apps')
                    .insert([{ 
                        name, 
                        developer,
                        description, 
                        exe_url: directFileUrl,
                        reviews: JSON.stringify([{user: "System", text: "تم نشر التطبيق بنجاح في المتجر."}])
                    }]);

                if (dbError) throw dbError;

                alert('Package uploaded and published successfully!');
                
                document.getElementById('appName').value = '';
                document.getElementById('appDev').value = '';
                document.getElementById('appDesc').value = '';
                selectedFile = null;
                fileInput.value = '';
                dropZone.classList.remove('has-file');
                dropZoneText.innerHTML = 'Drag & Drop your APK or AAB file here';
                
                fetchApps();
            } catch (err) {
                console.error('Error publishing package:', err);
                alert('Upload failed: ' + err.message);
            } finally {
                publishBtn.disabled = false;
                publishBtn.textContent = 'Upload & Publish Package';
            }
        }

        window.onload = fetchApps;
    </script>
</body>
</html>
