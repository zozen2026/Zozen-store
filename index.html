<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zozen Store - Apps Hub</title>
    
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #222222;
            --accent-color: #0066ff;
            --accent-hover: #0052cc;
            --card-bg: #f8f9fa;
            --border-color: #e5e5e5;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            padding: 20px 40px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
            color: var(--accent-color);
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
            flex: 1;
            width: 100%;
            box-sizing: border-box;
        }

        .section-title {
            font-size: 20px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
            font-weight: 600;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-top {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 15px;
        }

        .app-favicon {
            width: 36px;
            height: 36px;
            object-fit: contain;
            border-radius: 8px;
            background: #fff;
            padding: 4px;
            border: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .card-header h3 {
            margin: 0 0 6px 0;
            font-size: 17px;
            color: #111;
        }

        .card-header p {
            color: #666;
            font-size: 13px;
            margin: 0;
            line-height: 1.4;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: auto;
        }

        .app-launch-btn, .app-shortcut-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        .app-launch-btn {
            background-color: var(--accent-color);
            border: 2px solid var(--accent-color);
            color: #ffffff;
        }

        .app-launch-btn:hover {
            background-color: var(--accent-hover);
        }

        .app-shortcut-btn {
            background-color: #ffffff;
            border: 2px solid var(--accent-color);
            color: var(--accent-color);
        }

        .app-shortcut-btn:hover {
            background-color: #f0f4ff;
        }

        .dev-section {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 30px;
            margin-bottom: 40px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            font-weight: 500;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }

        .btn-submit {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }

        .btn-submit:hover {
            background-color: var(--accent-hover);
        }

        footer {
            text-align: center;
            padding: 20px;
            border-top: 1px solid var(--border-color);
            color: #777;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Zozen Store</h1>
        <span>Custom Icons Apps Hub</span>
    </header>

    <div class="container">
        <div class="section-title">Store Applications</div>
        <div class="grid" id="appsContainer">
            <p id="loadingText" style="color: #888;">Loading applications from database...</p>
        </div>

        <div class="section-title">Developer Hub - Publish App</div>
        <div class="dev-section">
            <div class="form-group">
                <label>Application Name</label>
                <input type="text" id="appName" placeholder="e.g. YouTube">
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea id="appDesc" rows="3" placeholder="Brief explanation..."></textarea>
            </div>
            <div class="form-group">
                <label>Target URL / App Link</label>
                <input type="text" id="appExeUrl" placeholder="https://www.youtube.com">
            </div>
            <button class="btn-submit" onclick="publishApp()">Publish Application</button>
        </div>
    </div>

    <footer>
        &copy; 2026 Zozen Store. All rights reserved.
    </footer>

    <script>
        const SUPABASE_URL = "https://lzvtnfdgynwczrkwlwhf.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx6dnRuZmRneW53Y3pya3dsd2hmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxNDIxMTEsImV4cCI6MjEwNDcxODExMX0.w2hNlJ4SszyMBkUVjr1qiWNTTPxHMHkM9YOFtVP-pVI";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function fetchApps() {
            const container = document.getElementById('appsContainer');
            try {
                const { data: apps, error } = await supabaseClient.from('apps').select('*');
                if (error) throw error;

                container.innerHTML = '';
                if (!apps || apps.length === 0) {
                    container.innerHTML = '<p style="color: #888;">No applications available yet.</p>';
                    return;
                }

                apps.forEach(app => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    
                    const targetUrl = app.exe_url || app.file_url || '#';
                    const appName = app.name || 'Untitled App';
                    const appDesc = app.description || 'No description provided.';

                    let domain = '';
                    try {
                        const parsed = new URL(targetUrl.startsWith('http') ? targetUrl : 'https://' + targetUrl);
                        domain = parsed.hostname;
                    } catch (e) {
                        domain = '';
                    }
                    const faviconUrl = domain ? `https://www.google.com/s2/favicons?domain=${domain}&sz=64` : 'https://cdn-icons-png.flaticon.com/512/5977/5977575.png';

                    card.innerHTML = `
                        <div>
                            <div class="card-top">
                                <img src="${faviconUrl}" class="app-favicon" alt="icon" onerror="this.src='https://cdn-icons-png.flaticon.com/512/5977/5977575.png'">
                                <div class="card-header">
                                    <h3>${appName}</h3>
                                    <p>${appDesc}</p>
                                </div>
                            </div>
                        </div>
                        <div class="btn-group">
                            <button onclick="launchAsApp('${targetUrl.replace(/'/g, "\\'")}')" class="app-launch-btn">
                                Launch App Window
                            </button>
                            <button onclick="createDesktopShortcut('${targetUrl.replace(/'/g, "\\'")}', '${appName.replace(/'/g, "\\'")}')" class="app-shortcut-btn">
                                Download .url Shortcut
                            </button>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                console.error('Error fetching apps:', err);
                container.innerHTML = '<p style="color: #d9534f;">Failed to load items. Please check your Supabase configuration.</p>';
            }
        }

        async function launchAsApp(url) {
            if (!url || url === '#' || url === 'undefined' || url === 'null') {
                alert('عذراً، هذا التطبيق لا يحتوي على رابط صالح.');
                return;
            }
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }
            window.open(url, '_blank');
        }

        function createDesktopShortcut(url, name) {
            if (!url || url === '#' || url === 'undefined' || url === 'null') {
                alert('عذراً، هذا التطبيق لا يحتوي على رابط صالح.');
                return;
            }
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }

            const shortcutContent = `[InternetShortcut]\nURL=${url}\n`;
            const blob = new Blob([shortcutContent], { type: 'text/plain;charset=utf-8' });
            const link = document.createElement8 ? document.createElement('a') : document.createElement('a'); // simplified
            link.href = URL.createObjectURL(blob);
            
            const safeName = name.replace(/[/\\?%*:|"<>]/g, '_');
            link.download = `${safeName}.url`;
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        async function publishApp() {
            const name = document.getElementById('appName').value.trim();
            const description = document.getElementById('appDesc').value.trim();
            const exe_url = document.getElementById('appExeUrl').value.trim();

            if (!name || !exe_url) {
                alert('Please provide both the Application Name and URL.');
                return;
            }

            try {
                const { error } = await supabaseClient.from('apps').insert([{ name, description, exe_url }]);
                if (error) throw error;

                alert('Application published successfully!');
                document.getElementById('appName').value = '';
                document.getElementById('appDesc').value = '';
                document.getElementById('appExeUrl').value = '';
                fetchApps();
            } catch (err) {
                console.error('Error inserting app:', err);
                alert('Error publishing application: ' + err.message);
            }
        }

        window.onload = fetchApps;
    </script>
</body>
</html>
