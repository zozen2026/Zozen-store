<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zozen Store - Direct Packages Hub</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #1e293b;
            --accent-color: #ea580c;
            --accent-hover: #c2410c;
            --card-bg: #f8fafc;
            --border-color: #e2e8f0;
            --success-color: #10b981;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            padding: 20px 40px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
        }

        header h1 {
            margin: 0;
            font-size: 22px;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
            flex: 1;
            width: 100%;
            box-sizing: border-box;
        }

        .section-title {
            font-size: 18px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
            font-weight: 700;
            color: #334155;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.05);
        }

        .card-top {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 12px;
        }

        .app-icon {
            width: 42px;
            height: 42px;
            background: #ffedd5;
            color: var(--accent-color);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
            border: 1px solid #fed7aa;
        }

        .card-header h3 {
            margin: 0 0 4px 0;
            font-size: 16px;
            color: #0f172a;
        }

        .developer-name {
            font-size: 11px;
            color: var(--accent-color);
            font-weight: 600;
            margin-bottom: 6px;
        }

        .card-header p {
            color: #64748b;
            font-size: 13px;
            margin: 0;
            line-height: 1.4;
        }

        .file-meta {
            font-size: 11px;
            color: #64748b;
            margin-bottom: 15px;
            background: #fff;
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            word-break: break-all;
        }

        .app-install-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            text-decoration: none;
            background-color: var(--accent-color);
            border: none;
            color: #ffffff;
            transition: background-color 0.2s ease;
        }

        .app-install-btn:hover {
            background-color: var(--accent-hover);
        }

        .dev-section {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 40px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            font-weight: 600;
            color: #475569;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 13px;
            background: #fff;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus, .form-group textarea:focus {
            border-color: var(--accent-color);
        }

        .btn-submit {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 11px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            width: 100%;
            transition: background-color 0.2s ease;
        }

        .btn-submit:hover {
            background-color: var(--accent-hover);
        }

        footer {
            text-align: center;
            padding: 20px;
            border-top: 1px solid var(--border-color);
            color: #94a3b8;
            font-size: 12px;
            background: #fff;
        }
    </style>
</head>
<body>

    <header>
        <h1><i class="fa-solid fa-store"></i> Zozen Store</h1>
        <span style="font-size: 13px; color: #64748b;">Sovereign Packages Hub</span>
    </header>

    <div class="container">
        <div class="section-title">Applications Available</div>
        <div class="grid" id="appsContainer">
            <p style="color: #64748b; font-size: 13px;">Loading store apps...</p>
        </div>

        <div class="section-title">Developer Hub - Publish App</div>
        <div class="dev-section">
            <div class="form-group">
                <label>Application Name</label>
                <input type="text" id="appName" placeholder="e.g. Zozen Video Hub">
            </div>
            <div class="form-group">
                <label>Developer / Publisher</label>
                <input type="text" id="appDev" placeholder="e.g. Zozen Team">
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea id="appDesc" rows="2" placeholder="Brief description..."></textarea>
            </div>
            <div class="form-group">
                <label>App / Web URL</label>
                <input type="text" id="appUrlInput" placeholder="https://...">
            </div>
            <button class="btn-submit" id="publishBtn" onclick="publishApp()">Publish to Store</button>
        </div>
    </div>

    <footer>
        &copy; 2026 Zozen Store. All rights reserved.
    </footer>

    <script>
        const SUPABASE_URL = "https://lzvtnfdgynwczrkwlwhf.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx6dnRuZmRneW53Y3pya3dsd2hmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxNDIxMTEsImV4cCI6MjEwNDcxODExMX0.w2hNlJ4SszyMBkUVjr1qiWNTTPxHMHkM9YOFtVP-pVI";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // إرسال طلب التثبيت لنظام Doors أو فتحه كرابط نظيف
        function installApp(appName, appUrl) {
            if (window.opener && !window.opener.closed) {
                window.opener.postMessage({
                    type: 'INSTALL_DOORS_APP',
                    appName: appName,
                    appUrl: appUrl,
                    appIcon: 'fa-solid fa-cube text-white',
                    appColor: 'bg-orange-600'
                }, '*');
                alert(`تم تثبيت "${appName}" داخل بيئة Doors بنجاح!`);
            } else {
                window.open(appUrl, '_blank');
            }
        }

        async function fetchApps() {
            const container = document.getElementById('appsContainer');
            try {
                const { data: apps, error } = await supabaseClient
                    .from('apps')
                    .select('*')
                    .order('id', { ascending: false });

                if (error) throw error;

                container.innerHTML = '';
                if (!apps || apps.length === 0) {
                    container.innerHTML = '<p style="color: #64748b; font-size: 13px;">No applications found.</p>';
                    return;
                }

                apps.forEach(app => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    
                    const appUrl = app.exe_url || app.file_url || 'https://zozen.vercel.app';
                    const appName = app.name || 'Untitled App';
                    const devName = app.developer || 'Zozen Official';
                    const appDesc = app.description || 'Sovereign web application.';

                    card.innerHTML = `
                        <div>
                            <div class="card-top">
                                <div class="app-icon"><i class="fa-solid fa-cube"></i></div>
                                <div class="card-header">
                                    <h3>${appName}</h3>
                                    <div class="developer-name">By ${devName}</div>
                                    <p>${appDesc}</p>
                                </div>
                            </div>
                            <div class="file-meta">
                                <strong>URL:</strong> ${appUrl}
                            </div>
                        </div>
                        <button onclick="installApp('${appName}', '${appUrl}')" class="app-install-btn">
                            <i class="fa-solid fa-download"></i> تثبيت داخل Doors
                        </button>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                console.error('Error:', err);
                container.innerHTML = '<p style="color: #ef4444; font-size: 13px;">Failed to load apps.</p>';
            }
        }

        async function publishApp() {
            const name = document.getElementById('appName').value.trim();
            const developer = document.getElementById('appDev').value.trim() || 'Zozen Official';
            const description = document.getElementById('appDesc').value.trim();
            const url = document.getElementById('appUrlInput').value.trim();
            const publishBtn = document.getElementById('publishBtn');

            if (!name || !url) {
                alert('الرجاء إدخال اسم التطبيق ورابطه.');
                return;
            }

            publishBtn.disabled = true;
            publishBtn.textContent = 'Publishing...';

            try {
                const { error } = await supabaseClient
                    .from('apps')
                    .insert([{ name, developer, description, exe_url: url }]);

                if (error) throw error;

                alert('Published successfully!');
                document.getElementById('appName').value = '';
                document.getElementById('appDev').value = '';
                document.getElementById('appDesc').value = '';
                document.getElementById('appUrlInput').value = '';
                fetchApps();
            } catch (err) {
                alert('Error: ' + err.message);
            } finally {
                publishBtn.disabled = false;
                publishBtn.textContent = 'Publish to Store';
            }
        }

        window.onload = fetchApps;
    </script>
</body>
</html>
